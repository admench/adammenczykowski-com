faq:
  title: "Frequently asked questions"
  description: "A little more about what I do, how I work and where I came from."
  categories:
    - title: "What I do"
      questions:
        - label: "What do you do?"
          content: |
            I'm a design engineer and full-stack developer. I take ideas from early conversations and rough sketches through UX, interface design, technical architecture, development, deployment and ongoing improvement. That broad view helps me make practical decisions without losing sight of the people who will use the finished product.
        - label: "What kinds of products do you build?"
          content: |
            I build bespoke business software, internal systems, member and client portals, reporting tools, directories and content-rich CMS websites. I particularly enjoy untangling complex workflows and turning scattered tools, spreadsheets or legacy systems into one clear, maintainable product.
        - label: "Do you handle both design and development?"
          content: |
            Yes. I work across product thinking, UX and visual design as well as front-end and back-end engineering. Depending on the project, that can mean prototyping in Figma, planning data and system architecture, building interfaces and APIs, or managing infrastructure and deployment.
        - label: "What technologies do you work with?"
          content: |
            My recent work centres on Laravel, Statamic, Vue, Nuxt and Tailwind CSS. I also work with tools such as Inertia, GraphQL, Typesense, AWS, Laravel Forge, Sentry and Figma. I choose technology around the problem rather than forcing every project into the same stack.
    - title: "Working together"
      questions:
        - label: "How can I work with you?"
          content: |
            Most of my client work happens through [You I](https://youi.design), the small digital product studio I run with my wife, Abby. I also have experience joining established teams as a senior JavaScript developer and technical partner. The best place to start is a conversation about the problem you are trying to solve.
        - label: "Who do you usually work with?"
          content: |
            Through You I, I work with established businesses, charities and membership organisations that need to replace outdated systems, improve difficult processes or create better digital services. I've worked directly with local and international clients as well as within larger in-house development teams.
        - label: "Can you replace an old or legacy system?"
          content: |
            Yes. Legacy replacement is about much more than rebuilding screens. I take time to understand existing workflows, data relationships, integrations, security requirements and the people who rely on the system. For Eccles Fisher, we replaced a nearly 40-year-old desktop application while preserving decades of publishing data and moving hundreds of users to a secure web platform.
        - label: "Do you provide ongoing support?"
          content: |
            Yes. I believe software needs care after launch, so ongoing monitoring, maintenance, performance work and feature development are a normal part of many long-term client relationships. Support arrangements are tailored to the product and the level of help required.
    - title: "About me"
      questions:
        - label: "Where are you based?"
          content: |
            I'm based in Hitchin, Hertfordshire, in the UK. I work both remotely and in person, and have collaborated with clients and teams across the UK, Europe and North America.
        - label: "How did you get into software development?"
          content: |
            I'm a self-taught developer. After studying Music Production, I spent several years running a recording studio and touring internationally as a live sound engineer. I began freelancing as a web developer in 2012, co-founded You I in 2014 and have been designing and building software ever since.
        - label: "What matters to you in your work?"
          content: |
            Simplicity, usefulness and longevity. I like getting close to a problem, communicating clearly and making complex systems feel calm and intuitive. I care equally about clean interfaces, maintainable code and the long-term relationship behind a project.
        - label: "What do you do outside work?"
          content: |
            I'm a father, husband and musician. Music came before software and remains an important part of who I am, whether I'm playing, recording or simply listening.
