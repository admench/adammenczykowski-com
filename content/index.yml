faq:
  title: "A few things you might ask"
  description: "Work, music, technology and the person connecting them."
  categories:
    - title: "Work"
      questions:
        - label: "What do you do?"
          content: |
            I'm a design engineer and full-stack developer. I work across product thinking, user experience, interface design and software engineering, often taking an idea from the first sketch through to a reliable product in people's hands.
        - label: "What kinds of problems interest you?"
          content: |
            Messy, important ones. I enjoy untangling complicated workflows, ageing systems and scattered tools, then turning them into something people can understand and depend on. The technology matters, but only in service of making the problem clearer.
        - label: "What does good software look like to you?"
          content: |
            Useful, understandable and durable. It should solve a real problem, feel calm to use and remain maintainable after the excitement of launch has passed. Good software respects both the people using it and the people who will look after it.
        - label: "How can we work together?"
          content: |
            Most of my client work happens through [You I](https://youi.design), the digital product studio I run with my wife, Abby. I also collaborate with established product and engineering teams. If you have an interesting problem or simply want to compare notes, [send me an email](mailto:adam@youi.design).
    - title: "Backstory"
      questions:
        - label: "How did you go from music to software?"
          content: |
            I studied Music Production, ran a recording studio and spent six years producing records and touring as a live sound engineer. I began teaching myself web development and freelancing in 2012 (even though my first website was back in 1999!), then co-founded You I in 2014. The tools changed, but the mix of creativity, technology and collaboration felt familiar.
        - label: "What did touring teach you?"
          content: |
            Listen closely, prepare properly and stay calm when something breaks in front of a room full of people. Live sound also taught me that the best technical work is often invisible: people may never notice the details, but they feel the result. I still approach software in much the same way.
        - label: "Why work across design and engineering?"
          content: |
            Because the most important product decisions rarely belong entirely to one discipline. Understanding both lets me carry context from a conversation into an interface, a data model and the finished experience without losing the original intent along the way.
    - title: "Life & ideas"
      questions:
        - label: "Where are you based?"
          content: |
            I live in Hitchin, Hertfordshire, in the UK. It is close enough to London when I need the city and far enough away to enjoy a quieter pace the rest of the time.
        - label: "What do you do away from the screen?"
          content: |
            I'm a husband, father and still a musician. Family life occupies most of the space beyond work, while playing, recording and listening to music keep me connected to the creative life I had before software. I'm pretty handy when it comes to Woodwork & DIY - another passion of mine!
        - label: "What are you curious about right now?"
          content: |
            How AI changes creative and technical work, what human judgment becomes more valuable as information gets cheaper, and how experienced people can keep adapting without chasing every trend. I'm also learning how to share more of my thinking through writing and video.
        - label: "Why have a personal site?"
          content: |
            My work is only one part of my identity. This gives me a place to connect the ideas that cross music, software, craft, family and technological change, without forcing everything through the lens of a company or a particular platform.
