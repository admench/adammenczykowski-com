  description: |
    I'm a self-taught developer with more than 15 years of experience designing and building digital products. As Technical Director and Co-Founder of You I, I work across strategy, UX, architecture, back-end and front-end development to create software that feels straightforward, even when the problem behind it is complex. I'm happiest combining clean design, thoughtful communication and solid engineering to build things that work beautifully and last.
