about:
  title: "Craft, curiosity and making things useful"
  description: |
    Before I wrote software, I made records and mixed live shows around the world. That first career taught me to listen closely, stay calm when things go wrong and care about the details people feel even when they cannot see them. Today, I bring that same mindset to design and engineering. I'm a self-taught developer, co-founder, husband, father and musician, interested in how craft, technology and clear thinking can turn complexity into something useful. This is where I share what I'm building, what I'm learning and the ideas connecting those parts of my life.
