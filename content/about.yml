title: "About Adam"
description: "I'm a musician-turned-design engineer, self-taught developer and lifelong maker based in Hitchin, UK."
content: |
  Before software, there was music. I studied Music Production, ran a recording studio in Letchworth and spent six years producing records and mixing live shows around the world with artists including Phoenix, Get Cape. Wear Cape. Fly. and Good Shoes. Hundreds of soundchecks and shows taught me to listen carefully, stay calm when things go wrong and care about the details most people never see but everyone feels.

  I started teaching myself web development in 2012. The tools changed, but what attracted me to the work did not: craft, technology, collaboration and the satisfaction of turning a rough idea into a useful experience. In 2014, I co-founded [You I](https://youi.design) with my wife, Abby. Today, I work across design and engineering, following complicated products from the first conversation through interface design, architecture and code.

  ## What connects it all

  I'm interested in making complicated things understandable. In software, that means creating products that feel clear, useful and durable without pretending the complexity behind them does not exist. More broadly, it shapes how I think about communication, creativity, technological change and the value of good judgment. I prefer practical decisions over fashionable ones, and I believe the best work begins with curiosity and listening.

  ## Away from the screen

  I'm a husband, father and still a musician. I live in Hitchin, Hertfordshire, and this site is where I share what I'm building, what I'm learning and the ideas connecting the different parts of my life. If any of that resonates, [say hello](mailto:adam@youi.design).
